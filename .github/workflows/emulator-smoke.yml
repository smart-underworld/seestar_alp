name: Emulator smoke test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: TEMPORARY diagnostic - test api.pureapk.com (apkeep's backend) from a real runner
        run: |
          echo "=== egress IP ==="
          curl -s -m 10 https://ifconfig.me || true
          echo
          echo "=== api.pureapk.com app_version lookup ==="
          curl -sD /tmp/pureapk_headers.txt -m 15 \
            -H "x-cv: 3172501" -H "x-sv: 29" -H "x-abis: arm64-v8a,armeabi-v7a,armeabi,x86,x86_64" -H "x-gp: 1" \
            "https://api.pureapk.com/m/v3/cms/app_version?hl=en-US&package_name=com.zwo.seestar" \
            -o /tmp/pureapk_resp.bin
          cat /tmp/pureapk_headers.txt
          echo "--- response size ---"
          wc -c /tmp/pureapk_resp.bin
          echo "--- challenge marker check ---"
          grep -aio "just a moment\|checking your browser\|cf-turnstile\|challenges.cloudflare\|cf-error" /tmp/pureapk_resp.bin | sort -u || echo "(no challenge markers found)"
          echo "--- extracted download URL ---"
          DL_URL=$(grep -ao 'https://download\.pureapk\.com/[^[:space:]"]*' /tmp/pureapk_resp.bin | head -1)
          echo "$DL_URL"
          if [ -n "$DL_URL" ]; then
            echo "=== attempting actual XAPK download from download.pureapk.com ==="
            curl -sD /tmp/download_headers.txt -m 60 -L "$DL_URL" -o /tmp/seestar.xapk
            cat /tmp/download_headers.txt
            echo "--- downloaded file size + type ---"
            wc -c /tmp/seestar.xapk
            file /tmp/seestar.xapk || true
          else
            echo "No download URL extracted - see raw response above"
          fi
        continue-on-error: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up QEMU (armhf emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Install backend + emulator + system-test dependencies
        run: |
          pip install -r requirements.txt
          pip install -e '.[emulator,system]'
          playwright install --with-deps chromium

      - name: Read smoke firmware version
        id: fw
        run: |
          python3 -c "
          import yaml
          doc = yaml.safe_load(open('emulator/firmware/versions.yaml'))
          version = doc['smoke_version']
          entry = next(v for v in doc['full_versions'] if v['version'] == version)
          print(f'version={entry[\"version\"]}')
          print(f'version_code={entry[\"version_code\"]}')
          " >> "$GITHUB_OUTPUT"

      - name: Cache firmware XAPK
        uses: actions/cache@v4
        with:
          path: /tmp/emulator-fw/unpacked/_xapk_cache
          key: firmware-xapk-${{ steps.fw.outputs.version_code }}

      - name: Provision firmware
        id: provision
        run: |
          python3 -m emulator.firmware.provision \
            --version "${{ steps.fw.outputs.version }}" \
            --version-code "${{ steps.fw.outputs.version_code }}" \
            --work-dir /tmp/emulator-fw/unpacked

      - name: Build emulator image
        run: docker build --platform linux/arm/v7 -t seestar-emulator emulator/

      - name: Launch emulator container
        run: |
          cd emulator
          ./run.sh --firmware-dir /tmp/emulator-fw --model S50 "${{ steps.fw.outputs.version }}" &
          echo $! > /tmp/emulator.pid

      - name: Wait for emulator ports
        run: |
          timeout 120 bash -c 'until nc -z 127.0.0.1 4700 && nc -z 127.0.0.1 4800; do sleep 2; done'

      - name: Run smoke tests
        run: |
          pytest tests/system --target emulator --host 127.0.0.1 \
            -m smoke --no-startup-polar-align \
            --screenshot=on --video=on -q

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-playwright-artifacts
          path: test-results/

      - name: Stop emulator container
        if: always()
        run: docker stop seestar-emulator 2>/dev/null || true
