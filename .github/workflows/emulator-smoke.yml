name: Emulator smoke test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: TEMPORARY diagnostic - test APK mirror reachability from a real runner
        run: |
          echo "=== egress IP ==="
          curl -s -m 10 https://ifconfig.me || true
          echo
          echo "=== APKPure direct download (known failing) ==="
          curl -sD - -m 15 -A "Mozilla/5.0" -o /tmp/apkpure_body.html \
            "https://d.apkpure.com/b/XAPK/com.zwo.seestar?versionCode=2846" | head -20
          echo "--- body head (first 500 bytes, to check for JS-challenge markers) ---"
          head -c 500 /tmp/apkpure_body.html; echo
          echo "--- challenge marker check ---"
          grep -io "just a moment\|checking your browser\|cf-turnstile\|challenges.cloudflare\|cf-error" /tmp/apkpure_body.html | sort -u || echo "(no challenge markers found)"
          echo
          echo "=== APKCombo app page ==="
          curl -sD - -m 15 -A "Mozilla/5.0" -o /tmp/apkcombo_body.html \
            "https://apkcombo.com/seestar/com.zwo.seestar/download/phone-3.3.0-apk" | head -20
          echo "--- body size ---"
          wc -c /tmp/apkcombo_body.html
          echo "--- challenge marker check ---"
          grep -io "just a moment\|checking your browser\|cf-turnstile\|challenges.cloudflare\|cf-error" /tmp/apkcombo_body.html | sort -u || echo "(no challenge markers found)"
          echo "--- any embedded direct apk/xapk link? ---"
          grep -io 'href="[^"]*\.apk[^"]*"\|href="[^"]*\.xapk[^"]*"\|"downloadUrl"[^,}]*\|/dld/[a-z0-9/_.-]*' /tmp/apkcombo_body.html | sort -u | head -10 || echo "(none found)"
        continue-on-error: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up QEMU (armhf emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Install backend + emulator + system-test dependencies
        run: |
          pip install -r requirements.txt
          pip install -e '.[emulator,system]'
          playwright install --with-deps chromium

      - name: Read smoke firmware version
        id: fw
        run: |
          python3 -c "
          import yaml
          doc = yaml.safe_load(open('emulator/firmware/versions.yaml'))
          version = doc['smoke_version']
          entry = next(v for v in doc['full_versions'] if v['version'] == version)
          print(f'version={entry[\"version\"]}')
          print(f'version_code={entry[\"version_code\"]}')
          " >> "$GITHUB_OUTPUT"

      - name: Cache firmware XAPK
        uses: actions/cache@v4
        with:
          path: /tmp/emulator-fw/unpacked/_xapk_cache
          key: firmware-xapk-${{ steps.fw.outputs.version_code }}

      - name: Provision firmware
        id: provision
        run: |
          python3 -m emulator.firmware.provision \
            --version "${{ steps.fw.outputs.version }}" \
            --version-code "${{ steps.fw.outputs.version_code }}" \
            --work-dir /tmp/emulator-fw/unpacked

      - name: Build emulator image
        run: docker build --platform linux/arm/v7 -t seestar-emulator emulator/

      - name: Launch emulator container
        run: |
          cd emulator
          ./run.sh --firmware-dir /tmp/emulator-fw --model S50 "${{ steps.fw.outputs.version }}" &
          echo $! > /tmp/emulator.pid

      - name: Wait for emulator ports
        run: |
          timeout 120 bash -c 'until nc -z 127.0.0.1 4700 && nc -z 127.0.0.1 4800; do sleep 2; done'

      - name: Run smoke tests
        run: |
          pytest tests/system --target emulator --host 127.0.0.1 \
            -m smoke --no-startup-polar-align \
            --screenshot=on --video=on -q

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-playwright-artifacts
          path: test-results/

      - name: Stop emulator container
        if: always()
        run: docker stop seestar-emulator 2>/dev/null || true
