name: Validate test suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  checks: write

jobs:
  run-test-suite:
    if: github.event_name == 'push' || 
        (github.event_name == 'pull_request' && github.event.action != 'closed') || 
        (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run lint checks
        run: ruff check

      - name: Run format checks
        run: ruff format --check

      - name: Run backend tests
        run: |
          pytest -m "not integration" --cov=device --cov=front \
            --cov-report=term --cov-report=xml:coverage-unit.xml --cov-fail-under=30.0 \
            --junit-xml=test-results/unit.xml -q

      - name: Run simulator integration tests
        run: pytest -m integration tests/integration --junit-xml=test-results/integration.xml -q

      - name: Publish unit & simulator test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit & Simulator Test Results
          path: 'test-results/*.xml'
          reporter: java-junit

      - name: Coverage summary (device + front)
        if: always()
        continue-on-error: true
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage-unit.xml
          format: markdown
          output: both
          thresholds: '30 60'

      - name: Add coverage to job summary
        if: always()
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Install frontend test dependencies
        run: npm ci
        working-directory: front

      - name: Run frontend tests
        run: npm test
        working-directory: front

      - name: Install front_v2 UI test dependencies
        run: npm ci
        working-directory: front_v2/ui

      - name: Run front_v2 UI tests with coverage gate
        run: npm run coverage
        working-directory: front_v2/ui

  test-cli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install cli package and test dependencies
        run: pip install -e "." pytest pytest-cov pytest-asyncio pytest-httpx
        working-directory: cli

      - name: Run cli tests with coverage gate
        run: |
          pytest --cov --cov-report=term --cov-report=xml:coverage-cli.xml --cov-fail-under=75 \
            --junit-xml=test-results/cli.xml -q
        working-directory: cli

      - name: Publish CLI test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: CLI Test Results
          path: 'cli/test-results/cli.xml'
          reporter: java-junit

      - name: Coverage summary (cli)
        if: always()
        continue-on-error: true
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: cli/coverage-cli.xml
          format: markdown
          output: both
          thresholds: '75 90'

      - name: Add coverage to job summary
        if: always()
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
