name: Emulator full regression, 64-bit (S50 Pro)

# The 64-bit (aarch64, RV1126B) firmware build: S30 Pro / S50 Pro. Same tests as
# emulator-full.yml, but on a native arm64 runner -- emulating aarch64 on an x86
# runner is too slow for the imager's 30 s plate-solve window.
on:
  pull_request:
    types: [labeled]
  schedule:
    - cron: "30 7 * * *"  # nightly, 07:30 UTC (after the armhf lane)
  workflow_dispatch: {}

permissions:
  contents: read
  checks: write

jobs:
  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-full-system'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.matrix.outputs.versions) }}
    needs: matrix
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install backend + system-test dependencies
        run: |
          pip install -r requirements.txt
          pip install -e '.[system]'
          playwright install --with-deps chromium

      - name: Cache firmware XAPK
        uses: actions/cache@v4
        with:
          path: /tmp/emulator-fw/unpacked/_xapk_cache
          key: firmware-xapk-${{ matrix.version }}

      - name: Cache astrometry index files
        uses: actions/cache@v4
        with:
          path: emulator/astrometry/index
          key: astrometry-index-4100-series-v1

      - name: Download astrometry index files (cache miss only)
        run: emulator/astrometry/download_index.sh

      - name: Provision 64-bit firmware
        run: |
          python3 -m emulator.firmware.provision \
            --version "${{ matrix.version }}" \
            --variant iscope_64 \
            --work-dir /tmp/emulator-fw/unpacked

      - name: Build emulator image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: emulator/
          file: emulator/Dockerfile.arm64
          platforms: linux/arm64
          tags: seestar-emulator-arm64:latest
          load: true
          cache-from: type=gha,scope=emulator-arm64
          cache-to: type=gha,mode=max,scope=emulator-arm64

      - name: Rebuild renderer star catalog for this run
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD/emulator/sim:/sim" \
            -v "$PWD/emulator/astrometry/index:/usr/local/astrometry/data:ro" \
            --entrypoint python3 seestar-emulator-arm64 \
            /sim/build_catalog.py /usr/local/astrometry/data/index-4107.fits /sim/data/stars.npy

      - name: Launch emulator container
        run: |
          cd emulator
          # See emulator-full.yml: capture the console to a file now, because
          # `docker run --rm` removes a crashed container immediately.
          ./run.sh --arch arm64 --skip-build --firmware-dir /tmp/emulator-fw --model S50P "${{ matrix.version }}" \
            > /tmp/emulator-launch.log 2>&1 &
          echo $! > /tmp/emulator.pid

      - name: Wait for emulator ports
        run: |
          timeout 180 bash -c 'until nc -z 127.0.0.1 4700 && nc -z 127.0.0.1 4800; do sleep 2; done'

      - name: Launch synthetic-sky renderer
        run: |
          cd emulator
          python3 -m sim.renderd --shared sim/shared --model S50P --catalog sim/data/stars.npy &
          echo $! > /tmp/renderd.pid

      - name: Run full regression tests
        # Polaris for the same reason as the armhf lane (see emulator-full.yml).
        run: |
          pytest tests/system --target emulator --host 127.0.0.1 \
            --pem /tmp/emulator-fw/unpacked/${{ matrix.version }}-64/interop.pem \
            --renderer-shared-dir emulator/sim/shared \
            --goto-target-name Polaris --goto-ra 2.5303 --goto-dec 89.2641 \
            -m full \
            --screenshot=on --video=on \
            --junit-xml=test-results/emulator-full-arm64-${{ matrix.version }}.xml -q

      - name: Publish emulator full regression results (${{ matrix.version }}, arm64)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Emulator Full Regression arm64 (${{ matrix.version }})
          path: 'test-results/emulator-full-arm64-${{ matrix.version }}.xml'
          reporter: java-junit

      - name: Print emulator container log on failure
        if: failure()
        run: |
          echo "::group::emulator-launch.log (run.sh's own output, incl. container console)"
          cat /tmp/emulator-launch.log 2>/dev/null || echo "(no log file — run.sh never started)"
          echo "::endgroup::"
          docker logs seestar-emulator > /tmp/emulator-container.log 2>&1 || true

      - name: Upload diagnostic artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-full-arm64-playwright-artifacts-${{ matrix.version }}
          path: |
            test-results/
            /tmp/seestar_alp_system_test/
            /tmp/emulator-launch.log
            /tmp/emulator-container.log

      - name: Stop renderer and emulator container
        if: always()
        run: |
          kill "$(cat /tmp/renderd.pid)" 2>/dev/null || true
          docker stop seestar-emulator 2>/dev/null || true

  matrix:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-full-system'
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          python3 -c "
          import json, yaml
          doc = yaml.safe_load(open('emulator/firmware/versions.yaml'))
          print('versions=' + json.dumps(doc['arm64_versions']))
          " >> "$GITHUB_OUTPUT"
